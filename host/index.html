<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Pico Park</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      padding-top: 20px;
    }

    canvas {
      background: #222;
      border: 4px solid white;
    }

    .panel {
      width: 220px;
      background: #1b1b1b;
      border: 3px solid white;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .panel h2 {
      margin-top: 0;
    }

    #qrcode {
      margin-top: 20px;
      background: white;
      padding: 10px;
      display: inline-block;
    }

    .ip {
      font-size: 20px;
      margin-top: 10px;
      color: #4dff88;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="container">

    <canvas id="game" width="800" height="600"></canvas>

    <div class="panel">
      <h2>CONECTAR</h2>

      <div class="ip" id="ipText"></div>

      <div id="qrcode"></div>
    </div>

  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

  <script>
    const ip = `${window.location.hostname}:3000`;

    document.getElementById("ipText").textContent = ip;

    new QRCode(document.getElementById("qrcode"), {
      text: ip,
      width: 180,
      height: 180,
    });
  </script>

  <script type="module" src="./js/main.js"></script>

</body>
</html>
